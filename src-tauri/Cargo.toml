[package]
name = "minidit"
version = "0.1.1"
description = "A lightweight text editor for note-taking"
authors = ["Aki Hamano"]
license = "GPL-2.0-or-later"
repository = "https://github.com/t-hamano/minidit"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# would otherwise conflict on Windows (rust-lang/cargo#8519).
name = "minidit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
encoding_rs = "0.8.44"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }
tauri-plugin-single-instance = "2"
notify-debouncer-mini = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[profile.release]
# Keeps the installer small.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
