[package]
name = "minidit"
version = "0.1.0"
description = "A lightweight text editor for note-taking"
authors = ["Aki Hamano"]
license = "GPL-2.0-or-later"
repository = "https://github.com/t-hamano/minidit"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# would otherwise conflict on Windows (rust-lang/cargo#8519).
name = "minidit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
encoding_rs = "0.8.44"

[profile.release]
# Keeps the installer small.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
