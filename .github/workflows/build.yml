name: Build

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    build:
        name: Build (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.1
              with:
                  workspaces: ./src-tauri -> target
                  key: build-${{ matrix.platform }}

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Tauri debug bundle
              # PowerShell would strip the quotes inside the JSON.
              shell: bash
              # The update files need the signing key, which only the release
              # workflow has.
              run: pnpm tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'
