name: Measure

# Measures the release build's startup time, memory usage, and installer size,
# and posts the results as a comment on the pull request.
on:
    workflow_dispatch:
    pull_request:
        paths:
            - 'src/**'
            - 'src-tauri/**'
            - 'index.html'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.ts'
            - '.github/workflows/measure.yml'
            - '.github/scripts/measure.py'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    measure:
        name: Measure (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.1
              with:
                  workspaces: ./src-tauri -> target
                  key: measure-${{ matrix.platform }}

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the release bundle
              shell: bash
              run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

            - name: Measure
              shell: bash
              env:
                  MEASURE_REPORT: report-${{ matrix.platform }}.md
              run: |
                  python -m pip install --quiet psutil
                  python .github/scripts/measure.py

            - name: Upload the report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: report-${{ matrix.platform }}
                  path: report-${{ matrix.platform }}.md

    comment:
        name: Comment the results
        needs: measure
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        timeout-minutes: 5

        steps:
            - name: Download the reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: report-*
                  merge-multiple: true

            # Updates the earlier comment instead of adding one per push.
            - name: Post or update the comment
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  marker='<!-- minidit-measure -->'
                  {
                    echo "$marker"
                    echo "## Performance"
                    echo
                    echo "Measured on GitHub Actions runners for $SHA. Runner times vary from run to run."
                    echo
                    cat report-macos-latest.md report-windows-latest.md
                  } > body.md
                  id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                    --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
                  if [ -n "$id" ]; then
                    gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
                  else
                    gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
                  fi
