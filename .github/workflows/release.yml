name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
    # Create the draft release once, before the builds start, with the
    # changelog generated by GitHub from the merged pull requests. Both
    # builds then upload their files to this same draft.
    create-release:
        name: Create the draft release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        timeout-minutes: 10
        outputs:
            release-id: ${{ steps.release.outputs.id }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check that the tag matches the app version
              shell: bash
              run: |
                  version=$(node -p "require('./src-tauri/tauri.conf.json').version")
                  if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
                    echo "::error::The tag $GITHUB_REF_NAME does not match the app version $version in tauri.conf.json."
                    exit 1
                  fi

            - name: Create the draft release
              id: release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                    echo "Release $GITHUB_REF_NAME already exists"
                  else
                    flags=()
                    if [[ "$GITHUB_REF_NAME" == *-* ]]; then
                      flags+=(--prerelease)
                    fi
                    gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                      --title "Minidit $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
                  fi
                  echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

    release:
        name: Release (${{ matrix.platform }})
        needs: create-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      args: '--target universal-apple-darwin'
                    - platform: windows-latest
                      args: ''
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: write
        timeout-minutes: 60

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check the signing secrets
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  names=(TAURI_SIGNING_PRIVATE_KEY)
                  if [[ "$RUNNER_OS" == "macOS" ]]; then
                    names+=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
                  fi
                  for name in "${names[@]}"; do
                    if [[ -z "${!name}" ]]; then
                      echo "::error::Missing repository secret: $name"
                      exit 1
                    fi
                  done
                  if [[ "$RUNNER_OS" == "macOS" && "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
                    echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
                    exit 1
                  fi

            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            # Uploads the installers, the signed update files, and
            # `latest.json` to the draft release. Publishing the draft ships
            # the update, since the app reads `latest.json` from the latest
            # release.
            - name: Build and release
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
                  APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
                  APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
                  APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
                  APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
              with:
                  releaseId: ${{ needs.create-release.outputs.release-id }}
                  args: ${{ matrix.args }}

            - name: Verify the macOS signature and notarization
              if: matrix.platform == 'macos-latest'
              shell: bash
              run: |
                  app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Minidit.app"
                  codesign --verify --deep --strict --verbose=2 "$app"
                  xcrun stapler validate "$app"
                  spctl --assess --type execute --verbose=2 "$app"
